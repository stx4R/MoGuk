<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>로그인 · 오량모의국회</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="moguk.css" />
<style>
  html, body { height: 100%; }
  .login {
    min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr;
  }

  /* ===== LEFT: mascot stage ===== */
  .stage {
    position: relative; overflow: hidden;
    background:
      radial-gradient(120% 90% at 30% 20%, rgba(30,215,96,0.16), transparent 60%),
      radial-gradient(100% 80% at 80% 90%, rgba(83,157,245,0.10), transparent 55%),
      #0e0e0e;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px;
    padding: 48px;
  }
  .stage .ring { position: absolute; border: 1px solid rgba(255,255,255,0.05); border-radius: 50%; }
  .stage .ring.r1 { width: 360px; height: 360px; } .stage .ring.r2 { width: 560px; height: 560px; } .stage .ring.r3 { width: 760px; height: 760px; }

  .mascots { position: relative; display: flex; align-items: flex-end; gap: 14px; height: 220px; z-index: 2; }
  .blob { position: relative; transition: transform 0.5s var(--ease-out); animation: floaty 4s ease-in-out infinite; }
  .blob:nth-child(2) { animation-delay: 0.6s; } .blob:nth-child(3) { animation-delay: 1.2s; } .blob:nth-child(4) { animation-delay: 0.3s; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

  .body { position: relative; }
  .b-green { width: 120px; height: 120px; border-radius: 50% 50% 46% 46%; background: linear-gradient(160deg, #34e979, #14b84e); }
  .b-tall { width: 76px; height: 168px; border-radius: 40px; background: linear-gradient(160deg, #3a3a3a, #232323); }
  .b-pink { width: 92px; height: 110px; border-radius: 50% 50% 44% 44%; background: linear-gradient(160deg, #ff8a96, #e35664); }
  .b-bird { width: 64px; height: 84px; border-radius: 52% 52% 46% 46%; background: linear-gradient(160deg, #cfd3d8, #9aa0a8); }
  .b-bird::after { /* beak */ content:""; position:absolute; right:-8px; top:38px; border-left:10px solid #f1c40f; border-top:6px solid transparent; border-bottom:6px solid transparent; }

  .face { position: absolute; inset: 0; }
  .eyes { position: absolute; top: 34%; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; }
  .eye { width: 20px; height: 20px; border-radius: 50%; background: #fff; position: relative; overflow: hidden; transition: height 0.18s ease; }
  .eye .pupil { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #111; top: 6px; left: 6px; transition: transform 0.25s var(--ease-out); animation: drift 3.6s ease-in-out infinite; }
  @keyframes drift { 0%,100%{transform:translate(0,0)} 25%{transform:translate(2.5px,1px)} 50%{transform:translate(0,1.5px)} 75%{transform:translate(-2px,0)} }
  .lid { position: absolute; inset: 0; background: inherit; }
  .mouth { position: absolute; top: 60%; left: 50%; transform: translateX(-50%); width: 16px; height: 8px; border-radius: 0 0 16px 16px; background: rgba(0,0,0,0.55); transition: all 0.25s ease; }
  .blush { position: absolute; top: 50%; width: 10px; height: 6px; border-radius: 50%; background: rgba(255,120,120,0.55); opacity: 0; transition: opacity 0.25s; }
  .blush.l { left: 18%; } .blush.r { right: 18%; }
  .b-tall .eyes { top: 26%; } .b-tall .mouth { top: 40%; }

  /* look toward the form (right) */
  .mascots.look-form .pupil { transform: translate(5px, 3px); animation: none; }
  /* hide eyes (password) */
  .mascots.hide .eye { height: 4px; }
  .mascots.hide .blush { opacity: 1; }
  .mascots.peek .eye { height: 20px; }
  /* sad (error) */
  .mascots.sad { animation: shake 0.45s; }
  .mascots.sad .mouth { top: 64%; height: 8px; border-radius: 16px 16px 0 0; background: rgba(0,0,0,0.6); }
  .mascots.sad .pupil { transform: translateY(4px); animation: none; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-7px)} 80%{transform:translateX(5px)} }
  /* happy (success) */
  .mascots.happy .blob { animation: jump 0.6s var(--ease-out); }
  .mascots.happy .eye { height: 10px; border-radius: 12px 12px 0 0; background: #fff; }
  .mascots.happy .mouth { width: 22px; height: 12px; background: rgba(0,0,0,0.55); }
  @keyframes jump { 0%,100%{transform:translateY(0)} 35%{transform:translateY(-26px)} 70%{transform:translateY(0)} }

  .stage-cap { z-index: 2; text-align: center; max-width: 340px; }
  .stage-cap .emblem-lg { width: 46px; height: 46px; border-radius: 50%; background: var(--green); display: grid; place-items: center; margin: 0 auto 18px; }
  .stage-cap .emblem-lg img { width: 30px; height: 30px; filter: brightness(0); }
  .stage-cap h2 { margin: 0 0 8px; font-family: var(--font-title); font-size: 24px; font-weight: 800; }
  .stage-cap p { margin: 0; color: var(--text-secondary); font-size: 14px; line-height: 1.6; }

  /* ===== RIGHT: form ===== */
  .formside { display: flex; align-items: center; justify-content: center; padding: 48px; background: var(--bg-base); }
  .formcard { width: 100%; max-width: 380px; }
  .formcard .top-back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 13px; font-weight: 600; margin-bottom: 32px; }
  .formcard .top-back:hover { color: #fff; }
  .formcard h1 { font-family: var(--font-title); font-size: 30px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.02em; }
  .formcard .lead { color: var(--text-secondary); font-size: 14px; margin: 0 0 28px; }

  .field-l { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin: 0 0 8px; }
  .pill-input { position: relative; margin-bottom: 18px; }
  .pill-input input {
    width: 100%; font-family: var(--font-ui); font-size: 14px; color: #fff;
    background: var(--surface-2); border: none; border-radius: var(--radius-pill);
    padding: 14px 18px; outline: none; box-shadow: var(--shadow-inset);
    transition: box-shadow 160ms;
  }
  .pill-input input:focus { box-shadow: #fff 0 0 0 1px inset; }
  .pill-input .toggle { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px; display: flex; }
  .pill-input .toggle:hover { color: #fff; }

  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 22px; }
  .remember { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; user-select: none; white-space: nowrap; }
  .remember input { accent-color: var(--green); width: 15px; height: 15px; }
  .row-between a { font-size: 13px; color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
  .row-between a:hover { color: #fff; }

  .err {
    display: none; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
    color: var(--no); background: rgba(243,114,127,0.1); border: 1px solid rgba(243,114,127,0.25);
    padding: 11px 14px; border-radius: 12px; margin-bottom: 18px;
  }
  .login.is-error .err { display: flex; }
  .login.is-error .pill-input input { box-shadow: var(--no) 0 0 0 1px inset; }
  .login.is-error .formcard { animation: shake 0.45s; }

  .divider { display: flex; align-items: center; gap: 14px; color: #555; font-size: 12px; margin: 20px 0; }
  .divider::before, .divider::after { content:""; height: 1px; flex: 1; background: var(--hairline); }

  .signup { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-secondary); }
  .signup a { color: var(--green); font-weight: 700; }

  /* success overlay */
  .success-over {
    position: fixed; inset: 0; background: rgba(10,10,10,0.86); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; z-index: 80;
  }
  .login.is-success .success-over { display: flex; animation: fadein 0.3s; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .check {
    width: 84px; height: 84px; border-radius: 50%; background: var(--green); display: grid; place-items: center;
    animation: pop 0.5s var(--ease-out); box-shadow: 0 0 40px rgba(30,215,96,0.5);
  }
  @keyframes pop { 0%{transform:scale(0)} 60%{transform:scale(1.12)} 100%{transform:scale(1)} }
  .check svg { width: 44px; height: 44px; stroke: #000; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 0.4s 0.25s var(--ease-out) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .success-over p { color: #fff; font-size: 18px; font-weight: 700; margin: 0; }

  /* demo controls */
  .demo-hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; background: rgba(24,24,24,0.9); border: 1px solid var(--hairline); border-radius: 999px; padding: 7px 8px 7px 16px; z-index: 90; }
  .demo-hint span { font-size: 11px; color: #777; font-weight: 600; }

  /* ===== PHONE ===== */
  @media (max-width: 560px) {
    .login { grid-template-columns: 1fr; }
    .stage { min-height: 300px; padding: 32px 24px; gap: 22px; }
    .stage .ring.r3 { display: none; }
    .mascots { height: 150px; transform: scale(0.78); }
    .stage-cap h2 { font-size: 20px; }
    .formside { padding: 32px 22px 80px; }
    .formcard .top-back { margin-bottom: 22px; }
  }
</style>
</head>
<body>

<div class="login" id="login">

  <!-- LEFT -->
  <div class="stage">
    <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
    <div class="mascots" id="mascots">
      <div class="blob"><div class="body b-green"></div><div class="face"><div class="eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div><div class="blush l"></div><div class="blush r"></div><div class="mouth"></div></div></div>
      <div class="blob"><div class="body b-tall"></div><div class="face"><div class="eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div><div class="mouth"></div></div></div>
      <div class="blob"><div class="body b-pink"></div><div class="face"><div class="eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div><div class="blush l"></div><div class="blush r"></div><div class="mouth"></div></div></div>
      <div class="blob"><div class="body b-bird"></div><div class="face"><div class="eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div><div class="mouth"></div></div></div>
    </div>
    <div class="stage-cap">
      <div class="emblem-lg"><img src="assets/moguk_logo.svg" alt="" /></div>
      <h2>오량모의국회</h2>
      <p>의원 계정으로 로그인하여<br />안건 투표에 참여하세요.</p>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="formside">
    <form class="formcard" id="form">
      <a class="top-back" href="main.html"><i data-lucide="arrow-left" style="width:15px;height:15px;"></i> 홈으로</a>
      <h1>다시 오신 걸 환영해요</h1>
      <p class="lead">이메일과 비밀번호를 입력해주세요.</p>

      <div class="err"><i data-lucide="alert-circle" style="width:15px;height:15px;"></i> 이메일 또는 비밀번호가 올바르지 않습니다.</div>

      <label class="field-l" for="email">이메일</label>
      <div class="pill-input">
        <input id="email" type="email" placeholder="member@moguk.kr" autocomplete="email" />
      </div>

      <label class="field-l" for="pw">비밀번호</label>
      <div class="pill-input">
        <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" />
        <button type="button" class="toggle" id="pwToggle" tabindex="-1" aria-label="비밀번호 표시"><i data-lucide="eye" style="width:18px;height:18px;"></i></button>
      </div>

      <div class="row-between">
        <label class="remember"><input type="checkbox" /> 로그인 유지</label>
        <a href="#">비밀번호를 잊으셨나요?</a>
      </div>

      <button type="submit" class="btn btn-green btn-block btn-lg" id="submitBtn">
        <i data-lucide="log-in" style="width:17px;height:17px;"></i> 로그인
      </button>

      <div class="divider">또는</div>
      <button type="button" class="btn btn-outlined btn-block btn-lg">Google로 계속하기</button>

      <p class="signup">계정이 없으신가요? <a href="#">회원가입</a></p>
    </form>
  </div>

  <!-- success overlay -->
  <div class="success-over">
    <div class="check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" /></svg></div>
    <p>환영합니다, 의원님!</p>
  </div>
</div>

<!-- demo controls (mock only) -->
<div class="demo-hint">
  <span>데모:</span>
  <button class="btn btn-dark btn-sm" id="demoErr">오류 보기</button>
  <button class="btn btn-green btn-sm" id="demoOk">성공 보기</button>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
  const login = document.getElementById('login');
  const mascots = document.getElementById('mascots');
  const email = document.getElementById('email');
  const pw = document.getElementById('pw');
  const form = document.getElementById('form');
  const pwToggle = document.getElementById('pwToggle');

  const clearStates = () => login.classList.remove('is-error');

  email.addEventListener('focus', () => { if (!pw.matches(':focus')) mascots.classList.add('look-form'); });
  email.addEventListener('input', () => { mascots.classList.add('look-form'); clearStates(); });
  email.addEventListener('blur', () => mascots.classList.remove('look-form'));

  pw.addEventListener('focus', () => { mascots.classList.remove('look-form'); mascots.classList.add('hide'); clearStates(); });
  pw.addEventListener('blur', () => mascots.classList.remove('hide'));

  pwToggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    pwToggle.innerHTML = show ? '<i data-lucide="eye-off" style="width:18px;height:18px;"></i>' : '<i data-lucide="eye" style="width:18px;height:18px;"></i>';
    mascots.classList.toggle('peek', show);
    lucide.createIcons();
  });

  function showError() {
    login.classList.remove('is-success');
    login.classList.add('is-error');
    mascots.classList.remove('hide','happy');
    mascots.classList.add('sad');
    setTimeout(() => mascots.classList.remove('sad'), 600);
  }
  function showSuccess() {
    login.classList.remove('is-error');
    mascots.classList.remove('hide','sad','look-form');
    mascots.classList.add('happy');
    login.classList.add('is-success');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    // mock rule: empty or contains "error" -> fail; otherwise success
    if (!email.value || !pw.value || /error|오류/i.test(email.value)) showError();
    else showSuccess();
  });

  document.getElementById('demoErr').addEventListener('click', showError);
  document.getElementById('demoOk').addEventListener('click', showSuccess);
</script>
</body>
</html>
