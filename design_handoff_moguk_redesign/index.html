<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MoGuk × Spotify(Toss) — 디바이스 미리보기</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="moguk.css" />
<style>
  body { background: #0a0a0a; }
  .top {
    position: sticky; top: 0; z-index: 30; background: rgba(10,10,10,0.85); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--hairline); padding: 16px 24px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .top .brand { font-size: 16px; }
  .top .tag { font-size: 12px; color: var(--text-secondary); }
  .page-tabs { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .page-tabs button {
    padding: 9px 16px; border-radius: 999px; border: none; cursor: pointer;
    background: var(--surface-2); color: var(--text-secondary); font-weight: 700; font-size: 13px; font-family: var(--font-ui);
    transition: background-color 150ms, color 150ms;
  }
  .page-tabs button:hover { color: #fff; }
  .page-tabs button.active { background: var(--green); color: #000; }

  .stagewrap { padding: 40px 24px 80px; }
  .page-title { text-align: center; margin: 0 auto 6px; font-family: var(--font-title); font-size: 26px; font-weight: 800; }
  .page-desc { text-align: center; color: var(--text-secondary); font-size: 14px; margin: 0 auto 40px; max-width: 540px; line-height: 1.6; }

  .devices { display: flex; gap: 56px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
  .devcol { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .devlabel { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 13px; font-weight: 700; }
  .devlabel .dim { color: #5a5a5a; font-weight: 600; }

  /* ===== iPhone (portrait) ===== */
  .iphone { width: 390px; height: 844px; border-radius: 56px; background: #1b1b1d; padding: 13px; box-shadow: 0 0 0 2px #2c2c2e, 0 40px 80px rgba(0,0,0,0.6); position: relative; }
  .iphone .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: var(--bg-base); position: relative; }
  .iphone .notch { position: absolute; top: 13px; left: 50%; transform: translateX(-50%); width: 120px; height: 30px; background: #1b1b1d; border-radius: 0 0 18px 18px; z-index: 5; }
  .iphone .dyn { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 86px; height: 26px; background: #000; border-radius: 16px; z-index: 6; }

  /* ===== iPad (landscape) ===== */
  .ipad { width: 1024px; height: 720px; border-radius: 34px; background: #1b1b1d; padding: 16px; box-shadow: 0 0 0 2px #2c2c2e, 0 40px 80px rgba(0,0,0,0.6); position: relative; }
  .ipad .screen { width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: var(--bg-base); }
  .ipad .cam { position: absolute; top: 50%; left: 7px; transform: translateY(-50%); width: 7px; height: 7px; border-radius: 50%; background: #000; box-shadow: inset 0 0 0 1px #333; }

  .frame { border: none; background: var(--bg-base); }
  /* iframe scaling: render the page at a wider logical width, scale down */
  .scaler { position: absolute; top: 0; left: 0; transform-origin: top left; }

  .hint { text-align: center; color: #5a5a5a; font-size: 12px; margin-top: 36px; }
  .hint code { color: var(--green); font-family: monospace; }

  @media (max-width: 1100px) {
    .ipad { width: 760px; height: 535px; }
  }
  @media (max-width: 820px) {
    .devices { gap: 40px; }
    .iphone { transform: scale(0.85); }
    .ipad { width: 90vw; height: calc(90vw * 0.704); }
  }
</style>
</head>
<body>

<div class="top">
  <span class="brand"><span class="emblem"><img src="assets/moguk_logo.svg" alt="" /></span> MoGuk × Spotify(Toss)</span>
  <span class="tag">리디자인 미리보기 · iPhone + iPad</span>
  <div class="page-tabs" id="tabs"></div>
</div>

<div class="stagewrap">
  <h2 class="page-title" id="ptitle"></h2>
  <p class="page-desc" id="pdesc"></p>

  <div class="devices">
    <div class="devcol">
      <span class="devlabel"><i data-lucide="smartphone" style="width:15px;height:15px;"></i> iPhone <span class="dim">· 세로 390 × 844</span></span>
      <div class="iphone">
        <div class="dyn"></div>
        <div class="screen">
          <iframe class="frame" id="phoneFrame" title="iPhone preview"></iframe>
        </div>
      </div>
    </div>

    <div class="devcol">
      <span class="devlabel"><i data-lucide="tablet" style="width:15px;height:15px;"></i> iPad <span class="dim">· 가로 1180 × 820</span></span>
      <div class="ipad">
        <span class="cam"></span>
        <div class="screen">
          <iframe class="frame" id="padFrame" title="iPad preview"></iframe>
        </div>
      </div>
    </div>
  </div>

  <p class="hint">각 페이지는 실제 반응형으로 동작합니다 · 프레임 안에서 스크롤·클릭·투표·로그인 데모를 직접 사용해 보세요.</p>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  const PAGES = [
    { id:'main', file:'main.html', name:'메인 페이지', desc:'히어로 + 통계 + 참여 동아리 + (스크롤) 소개 섹션 전체를 한 페이지에 통합. 하단에 새 푸터.' },
    { id:'login', file:'login.html', name:'로그인 페이지', desc:'좌우 분할 레이아웃. 입력에 반응하는 마스코트, 오류 시 흔들림 + 슬픈 표정, 성공 시 점프 + 그린 체크.' },
    { id:'vote', file:'vote.html', name:'투표 페이지', desc:'안건 목록 + 상세 2열(데스크탑) / 안건 칩 스크롤러 + 카드(모바일). 찬성·반대·기권.' },
    { id:'dashboard', file:'dashboard.html', name:'대시보드', desc:'운영진 전용. 투표 관리 · 실시간 결과 · 역할별 접속자 · 스태프 채팅 + 명령어. 모바일은 하단 탭바.' },
    { id:'fallback', file:'fallback.html', name:'폴백 (404)', desc:'About · Chat · Help 페이지 대체. 서비스 종료 안내 + 이전 페이지 버튼.' },
  ];

  const phoneFrame = document.getElementById('phoneFrame');
  const padFrame = document.getElementById('padFrame');
  const tabs = document.getElementById('tabs');
  let active = 'main';

  // iPhone screen is 390-13*2 = 364 wide; render page at 364 (true phone width -> stacked layout). height 844-26.
  // iPad screen renders the page at its real landscape width.
  function sizeFrames() {
    // phone: native width, no scaling needed (page is responsive at this width)
    phoneFrame.style.width = '364px';
    phoneFrame.style.height = '818px';
    phoneFrame.style.transform = 'none';

    // ipad: render at logical 1180 wide then scale to fit the screen box
    const padScreen = padFrame.parentElement;
    const w = padScreen.clientWidth, h = padScreen.clientHeight;
    const logicalW = 1180;
    const scale = w / logicalW;
    padFrame.style.width = logicalW + 'px';
    padFrame.style.height = (h / scale) + 'px';
    padFrame.style.transformOrigin = 'top left';
    padFrame.style.transform = `scale(${scale})`;
  }

  function load(id) {
    active = id;
    const p = PAGES.find(x => x.id === id);
    document.getElementById('ptitle').textContent = p.name;
    document.getElementById('pdesc').textContent = p.desc;
    phoneFrame.src = p.file;
    padFrame.src = p.file;
    [...tabs.children].forEach(b => b.classList.toggle('active', b.dataset.id === id));
    sizeFrames();
  }

  PAGES.forEach(p => {
    const b = document.createElement('button');
    b.textContent = p.name; b.dataset.id = p.id;
    b.addEventListener('click', () => load(p.id));
    tabs.appendChild(b);
  });

  window.addEventListener('resize', sizeFrames);
  load('main');
  lucide.createIcons();
</script>
</body>
</html>
